name: LLM Regression Evaluation

on:
  push:
    paths:
      - "prompts/**"
      - "datasets/**"
      - "evaluator/**"
      - "app/**"
      - "baselines/**"
      - "dashboard/**"
      - "requirements.txt"
      - ".github/workflows/llm-eval.yml"

  pull_request:
    paths:
      - "prompts/**"
      - "datasets/**"
      - "evaluator/**"
      - "app/**"
      - "baselines/**"
      - "dashboard/**"
      - "requirements.txt"
      - ".github/workflows/llm-eval.yml"

jobs:
  validate:
    name: Validate LLM Evaluation System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate golden dataset
        run: |
          python datasets/validate_dataset.py

      - name: Compile project files
        run: |
          python -m py_compile app/models.py
          python -m py_compile app/classifier.py
          python -m py_compile app/prompt_loader.py
          python -m py_compile evaluator/run_evaluation.py
          python -m py_compile evaluator/save_results.py
          python -m py_compile evaluator/regression_detector.py
          python -m py_compile evaluator/case_comparison.py
          python -m py_compile dashboard/app.py

      - name: Run regression quality gate
        run: |
          python evaluator/regression_detector.py