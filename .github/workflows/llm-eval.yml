name: LLM Regression Evaluation

on:
  push:
    paths:
      - "prompts/**"
      - "datasets/**"
      - "evaluator/**"
      - "app/**"
      - ".github/workflows/llm-eval.yml"

  pull_request:
    paths:
      - "prompts/**"
      - "datasets/**"
      - "evaluator/**"
      - "app/**"
      - ".github/workflows/llm-eval.yml"

jobs:
  validate:
    name: Validate LLM Evaluation System
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Python setup
      # -------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -------------------------------------------------------
      # Validate golden dataset
      # -------------------------------------------------------

      - name: Validate golden dataset
        run: |
          python datasets/validate_dataset.py


      # -------------------------------------------------------
      # Python compile / syntax checks
      # -------------------------------------------------------

      - name: Compile project files
        run: |
          python -m py_compile app/models.py
          python -m py_compile app/classifier.py
          python -m py_compile app/prompt_loader.py
          python -m py_compile evaluator/run_evaluation.py
          python -m py_compile evaluator/regression_detector.py
          python -m py_compile evaluator/case_comparison.py


      # -------------------------------------------------------
      # Regression quality gate
      # -------------------------------------------------------

      - name: Run regression gate
        run: |
          python evaluator/regression_detector.py